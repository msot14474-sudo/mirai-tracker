name: mirai-tracker-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirai_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-mirai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-mirai} -d ${POSTGRES_DB:-mirai_tracker}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the HTTPS application URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mirai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mirai_tracker}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:?Set INTERNAL_JOB_SECRET}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_API_URL: http://api:3000
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:?Set INTERNAL_JOB_SECRET}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      target: web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/health.html']
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
